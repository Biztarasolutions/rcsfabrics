[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://rcsfabrics-backend.onrender.com/api/:splat"
  status = 200
  force = true

[images]
  remote_images = ["https://eufihjcpdolquyxucnpf\\.supabase\\.co/storage/v1/object/public/.*"]

[build.environment]
  NEXT_PUBLIC_IMAGE_CDN = "netlify"

# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY (for admin image
# uploads) are set in the Netlify dashboard, not here.
